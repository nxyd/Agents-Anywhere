name: build-server-image

# Builds the self-hosted `server` image (docker/Dockerfile --target server) on a
# GitHub-hosted runner and publishes it as a release asset, so memory-constrained
# hosts only have to `docker load` instead of compiling.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag/branch/sha) to build
        required: true
        default: v2.2.0

permissions:
  contents: write

concurrency:
  group: build-server-image-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Show source revision
        run: |
          echo "building ${{ inputs.ref }} at $(git rev-parse HEAD)"
          docker version --format 'docker server {{.Server.Version}}'
          df -h /

      - name: Build server image
        run: |
          docker build \
            --progress=plain \
            -f docker/Dockerfile --target server \
            -t agents-anywhere-server:postgres \
            .

      - name: Verify image
        run: |
          docker images agents-anywhere-server --format '{{.ID}} {{.Tag}} {{.Size}}'
          docker run --rm --entrypoint sh agents-anywhere-server:postgres -c 'cat /app/server/pyproject.toml | head -5'

      - name: Package image
        run: |
          docker save agents-anywhere-server:postgres | zstd -T0 -10 -o agents-anywhere-server.tar.zst
          ls -lh agents-anywhere-server.tar.zst
          echo "sha256=$(sha256sum agents-anywhere-server.tar.zst | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="image-$(echo '${{ inputs.ref }}' | tr '/' '-')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "server image ${{ inputs.ref }}" \
              --notes "Self-hosted server image built from ${{ inputs.ref }} at $(git rev-parse HEAD)."
          fi
          gh release upload "$TAG" agents-anywhere-server.tar.zst --clobber